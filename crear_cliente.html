<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport" />
    <title>MiBodega - Nuevo Cliente</title>
    <!-- Tailwind CSS v3 with Plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <!-- BEGIN: Custom Configuration & Layout Styles -->
    <style data-purpose="tailwind-config">
        /* Custom font family setup */
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <style data-purpose="scroll-and-effects">
        /* Hide scrollbars for smooth app-like touch feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Dynamic soft shadows */
        .shadow-card-soft {
            box-shadow: 0 10px 30px -5px rgba(11, 30, 54, 0.07), 0 4px 12px -2px rgba(11, 30, 54, 0.04);
        }

        .shadow-btn-primary {
            box-shadow: 0 8px 24px -4px rgba(11, 30, 54, 0.35);
        }
    </style>
    <!-- END: Custom Configuration & Layout Styles -->
</head>

<body
    class="bg-[#f5f8fc] text-[#0b1e36] min-h-screen antialiased flex flex-col justify-between selection:bg-[#0b1e36] selection:text-white pb-28">
    <!-- BEGIN: MainHeader -->
    <header class="sticky top-0 z-40 bg-[#f5f8fc]/90 backdrop-blur-md px-5 pt-4 pb-3 border-b border-slate-200/60"
        data-purpose="app-header">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <!-- Brand Logo & Identity -->
            <div class="flex items-center gap-2.5">
                <div
                    class="w-10 h-10 rounded-xl bg-[#0b1e36] flex items-center justify-center text-white shadow-sm ring-2 ring-slate-100">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2"
                        viewbox="0 0 24 24">
                        <path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" stroke-linecap="round"
                            stroke-linejoin="round"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-[#0b1e36] leading-tight">MiBodega</h1>
                    <p class="text-[10px] font-bold text-slate-600 tracking-wider">CONTROL DE STOCK</p>
                </div>
            </div>
            <!-- Header Action Items: Reports & Operator Avatar -->
            <div class="flex items-center gap-3">
                <button aria-label="Historial y reportes"
                    class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-600 active:scale-95 transition-transform hover:bg-slate-50 shadow-sm"
                    type="button">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                        <path
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
                            stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </button>
                <div
                    class="w-9 h-9 rounded-full bg-blue-50 border-2 border-blue-200 flex items-center justify-center text-[#0b1e36] font-bold text-xs shadow-sm">
                    AD
                </div>
            </div>
        </div>
    </header>
    <!-- END: MainHeader -->
    <!-- BEGIN: FormContainerSection -->
    <main class="w-full max-w-md mx-auto px-4 pt-4 pb-2" data-purpose="registration-screen">
        <!-- Title & Navigation Subheader -->
        <div class="flex items-start gap-3.5 mb-5 px-1" data-purpose="screen-title-group">
            <button aria-label="Regresar a clientes"
                class="mt-0.5 w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-700 shadow-sm active:scale-90 transition-transform"
                type="button">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
                    <path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            </button>
            <div>
                <h2 class="text-2xl font-extrabold text-[#0b1e36] tracking-tight">Nuevo Cliente</h2>
                <p class="text-xs text-slate-600 font-medium leading-relaxed mt-0.5">Registra un nuevo contacto y
                    gestiona su límite de crédito en el sistema.</p>
            </div>
        </div>
        <!-- Main Client Card Form -->
        <div class="bg-white rounded-3xl p-5 border border-blue-50/80 shadow-card-soft">
            <form class="space-y-4" id="new-client-form" onsubmit="event.preventDefault();">
                <!-- Toggle: Persona Natural vs Empresa -->
                <div class="p-1 bg-[#f0f4ff] rounded-2xl flex items-center gap-1 border border-blue-100/60"
                    data-purpose="client-type-selector">
                    <button
                        class="flex-1 py-2 px-3 rounded-xl bg-[#0b1e36] text-white text-xs font-bold text-center shadow-sm transition-all flex items-center justify-center gap-1.5"
                        type="button">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                            <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                                stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Persona Natural
                    </button>
                    <button
                        class="flex-1 py-2 px-3 rounded-xl text-slate-600 hover:text-slate-900 text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5"
                        type="button">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                            <path
                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                                stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Empresa (RIF)
                    </button>
                </div>
                <!-- Field: Nombre Completo -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 tracking-wider uppercase mb-1.5"
                        for="client-name">
                        Nombre Completo <span class="text-rose-500">*</span>
                    </label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 pointer-events-none text-slate-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <input
                            class="w-full pl-11 pr-4 py-3 bg-[#f0f4ff]/80 focus:bg-white text-sm font-semibold text-[#0b1e36] placeholder:text-slate-500 rounded-2xl border border-transparent focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none transition-all"
                            id="client-name" name="client_name" placeholder="Ej: Juan Pérez" required="" type="text" />
                    </div>
                </div>
                <!-- Field: Cédula / Identificación -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 tracking-wider uppercase mb-1.5"
                        for="client-id">
                        Cédula / ID Documento <span class="text-rose-500">*</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <!-- Prefix Dropdown -->
                        <div class="relative w-24">
                            <select
                                class="w-full py-3 pl-3 pr-7 bg-[#f0f4ff]/80 text-sm font-bold text-[#0b1e36] rounded-2xl border border-transparent focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none appearance-none">
                                <option value="V">V - </option>
                                <option value="E">E - </option>
                                <option value="J">J - </option>
                                <option value="G">G - </option>
                            </select>
                            <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-600">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5"
                                    viewbox="0 0 24 24">
                                    <path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </div>
                        </div>
                        <!-- Number Input -->
                        <div class="relative flex-1 flex items-center">
                            <div class="absolute left-3.5 pointer-events-none text-slate-600">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
                                    viewbox="0 0 24 24">
                                    <path
                                        d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"
                                        stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </div>
                            <input
                                class="w-full pl-10 pr-4 py-3 bg-[#f0f4ff]/80 focus:bg-white text-sm font-semibold text-[#0b1e36] placeholder:text-slate-500 rounded-2xl border border-transparent focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none transition-all"
                                id="client-id" name="client_id" placeholder="12345678" required="" type="number" />
                        </div>
                    </div>
                </div>
                <!-- Field: Teléfono Móvil con acceso directo -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 tracking-wider uppercase mb-1.5"
                        for="client-phone">
                        Teléfono Móvil
                    </label>
                    <div class="relative flex items-center">
                        <div class="absolute left-3.5 pointer-events-none text-slate-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                                <path
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <input
                            class="w-full pl-10 pr-12 py-3 bg-[#f0f4ff]/80 focus:bg-white text-sm font-semibold text-[#0b1e36] placeholder:text-slate-500 rounded-2xl border border-transparent focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none transition-all"
                            id="client-phone" name="client_phone" placeholder="0412-0000000" type="tel" />
                        <!-- Quick WhatsApp Indicator Icon -->
                        <div
                            class="absolute right-3 w-7 h-7 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-200 pointer-events-none">
                            <svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 24 24">
                                <path
                                    d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m.01 1.67c4.54 0 8.24 3.7 8.24 8.24 0 2.2-.86 4.28-2.42 5.84a8.18 8.18 0 01-5.82 2.41c-1.42 0-2.82-.37-4.06-1.1l-.29-.17-3.02.79.81-2.94-.19-.3a8.163 8.163 0 01-1.25-4.53c0-4.54 3.7-8.24 8.24-8.24m4.52 11.66c-.25-.13-1.47-.72-1.7-.81-.23-.08-.39-.13-.56.13-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.13-1.06-.39-2.02-1.24-.75-.67-1.25-1.49-1.4-1.74-.14-.25-.02-.39.11-.51.11-.11.25-.29.37-.44.13-.14.17-.25.25-.42.08-.17.04-.31-.02-.44-.06-.13-.56-1.35-.77-1.85-.2-.49-.41-.42-.56-.43h-.48c-.17 0-.44.06-.67.31-.23.25-.88.86-.88 2.1 0 1.24.9 2.44 1.03 2.61.13.17 1.78 2.71 4.3 3.8 2.53 1.09 2.53.73 2.98.69.46-.04 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.23-.17-.48-.3">
                                </path>
                            </svg>
                        </div>
                    </div>
                </div>
                <!-- Financial Section: Deuda & Límite de Crédito -->
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <!-- Campo Deuda Inicial -->
                    <div class="p-3 bg-rose-50/50 rounded-2xl border border-rose-100">
                        <label class="block text-[10px] font-bold text-rose-800 tracking-wider uppercase mb-1"
                            for="initial-debt">
                            Deuda Inicial ($)
                        </label>
                        <div class="relative flex items-center">
                            <span class="text-rose-500 font-bold text-sm mr-1.5">$</span>
                            <input
                                class="w-full p-0 bg-transparent text-rose-700 font-extrabold text-base border-none focus:ring-0 outline-none"
                                id="initial-debt" name="initial_debt" type="text" value="0.00" />
                        </div>
                        <p class="text-[9px] text-rose-600/80 italic mt-1 leading-snug">Saldo pendiente por cobrar</p>
                    </div>
                    <!-- Campo Límite de Crédito -->
                    <div class="p-3 bg-emerald-50/50 rounded-2xl border border-emerald-100">
                        <label class="block text-[10px] font-bold text-emerald-800 tracking-wider uppercase mb-1"
                            for="credit-limit">
                            Límite Crédito ($)
                        </label>
                        <div class="relative flex items-center">
                            <span class="text-emerald-600 font-bold text-sm mr-1.5">$</span>
                            <input
                                class="w-full p-0 bg-transparent text-emerald-700 font-extrabold text-base border-none focus:ring-0 outline-none placeholder:text-emerald-400"
                                id="credit-limit" name="credit_limit" placeholder="50.00" type="text" />
                        </div>
                        <p class="text-[9px] text-emerald-700/80 italic mt-1 leading-snug">Monto máx. para fiado</p>
                    </div>
                </div>
                <!-- Field: Dirección de Habitación -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-700 tracking-wider uppercase mb-1.5"
                        for="client-address">
                        Dirección de Habitación / Entrega
                    </label>
                    <div class="relative">
                        <div class="absolute left-3.5 top-3.5 pointer-events-none text-slate-600">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                                <path
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                                    stroke-linecap="round" stroke-linejoin="round"></path>
                                <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round"
                                    stroke-linejoin="round"></path>
                            </svg>
                        </div>
                        <textarea
                            class="w-full pl-10 pr-4 py-2.5 bg-[#f0f4ff]/80 focus:bg-white text-xs font-medium text-[#0b1e36] placeholder:text-slate-500 rounded-2xl border border-transparent focus:border-blue-400 focus:ring-2 focus:ring-blue-100 outline-none resize-none transition-all"
                            id="client-address" name="client_address"
                            placeholder="Calle, Sector, Edificio o Punto de Referencia..." rows="2"></textarea>
                    </div>
                </div>
                <!-- Action Buttons Footer -->
                <div class="pt-3 flex items-center justify-between gap-3" data-purpose="form-actions">
                    <button
                        class="w-1/3 py-3.5 px-3 rounded-2xl text-slate-500 hover:text-slate-800 text-xs font-bold tracking-wide uppercase active:scale-95 transition-all text-center"
                        type="button">
                        Descartar
                    </button>
                    <button
                        class="w-2/3 py-3.5 px-4 rounded-2xl bg-[#0b1e36] text-white text-xs font-extrabold tracking-wide uppercase shadow-btn-primary active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                        type="submit">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
                            <path
                                d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
                                stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                        Registrar Cliente
                    </button>
                </div>
            </form>
        </div>
    </main>
    <!-- END: FormContainerSection -->
    <!-- BEGIN: BottomNavigationBar -->
    <nav class="fixed bottom-0 inset-x-0 z-50 bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-2 py-2"
        data-purpose="bottom-navigation">
        <div class="max-w-md mx-auto grid grid-cols-5 items-center text-center">
            <!-- Nav Item: Inventario -->
            <a class="flex flex-col items-center justify-center py-1 text-slate-600 hover:text-[#0b1e36] transition-colors"
                href="#">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                    <path
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="text-[10px] font-bold tracking-tight">Inventario</span>
            </a>
            <!-- Nav Item: Productos -->
            <a class="flex flex-col items-center justify-center py-1 text-slate-600 hover:text-[#0b1e36] transition-colors"
                href="#">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                    <path
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="text-[10px] font-bold tracking-tight">Productos</span>
            </a>
            <!-- Nav Item: Inicio (Dashboard) -->
            <a class="flex flex-col items-center justify-center py-1 text-slate-600 hover:text-[#0b1e36] transition-colors"
                href="#">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                    <path
                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="text-[10px] font-bold tracking-tight">Inicio</span>
            </a>
            <!-- Nav Item: Compras -->
            <a class="flex flex-col items-center justify-center py-1 text-slate-600 hover:text-[#0b1e36] transition-colors"
                href="#">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
                    <path
                        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
                        stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
                <span class="text-[10px] font-bold tracking-tight">Compras</span>
            </a>
            <!-- Nav Item: Clientes / Ventas (Activo) -->
            <a class="flex flex-col items-center justify-center py-1 text-[#0b1e36] relative" href="#">
                <div class="relative">
                    <svg class="w-5 h-5 mb-1 text-[#0b1e36]" fill="none" stroke="currentColor" stroke-width="2.5"
                        viewbox="0 0 24 24">
                        <path
                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                            stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                    <span
                        class="absolute -top-0.5 -right-1 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-white"></span>
                </div>
                <span class="text-[10px] font-extrabold tracking-tight text-[#0b1e36]">Clientes</span>
            </a>
        </div>
    </nav>
    <!-- END: BottomNavigationBar -->
</body>

</html>
