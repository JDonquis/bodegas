<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f8f9ff">
    <title>Sin conexión | MiBodega</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9ff;
            color: #0b1e36;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 10px 30px -10px rgba(11, 30, 54, .18);
        }

        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #002046;
            color: #2dd4bf;
            font-size: 28px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 8px;
        }

        p {
            font-size: 13px;
            line-height: 1.5;
            color: #64748b;
            margin: 0 0 20px;
        }

        button {
            border: 0;
            border-radius: 14px;
            background: #0b1e36;
            color: #fff;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">!</div>
        <h1>Sin conexión</h1>
        <p>No pudimos cargar MiBodega. Revisa tu conexión a internet e intenta nuevamente.</p>
        <button type="button" onclick="window.location.reload()">Reintentar</button>
    </div>
</body>

</html>
